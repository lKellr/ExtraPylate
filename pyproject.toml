requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ODEsolvers"

version = "0.0.0"

description = "Collection of ODE solvers"

readme = "README.md"

requires-python = ">=3.9"

license = "MIT"

authors = [{ name = "L. Kellerer", email = "l.kellerer1@gmx.de" }]

dependencies = ["numpy", "scipy", "matplotlib", "numba"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"problems/*" = ["F401", "F403", "F405"]
"tests/*" = ["F403", "F405"]
